name: Windows release readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-win-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: 2.8.1-0
          init-shell: powershell
          generate-run-shell: false
      - name: Run unified release-readiness gate
        shell: pwsh
        run: ./scripts/verify-release-readiness.ps1 -EvidenceLabel windows-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pathstitch-readiness-win-x64
          path: artifacts/readiness
